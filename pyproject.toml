[project]
name = "ai-product-growth-lab"
version = "1.0.0"
description = "Synthetic AI SaaS retention and economics research with a separate real-data study"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
